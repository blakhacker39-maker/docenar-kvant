<script>
(function () {
  var h = QB.h; QB.topbar('О проекте');
  var main = h('main', { class: 'wrap', id: 'main' }); document.body.appendChild(main);
  function sec(t, html) { main.appendChild(h('section', { class: 'card' }, [h('h2', { text: t }), h('div', { raw: html })])); }
  main.appendChild(h('h1', { text: 'О проекте' }));
  sec('Паспорт', '<div class="tw"><table class="t">' +
    '<tr><th>Название</th><td>DOCENAR • КВАНТ. От света к устройству материи</td></tr>' +
    '<tr><th>Вид ресурса</th><td>Дидактический конструктор: система из ' + QB.TOC.list.length + ' взаимосвязанных учебных модулей (интерактивный учебник)</td></tr>' +
    '<tr><th>Учебный предмет, класс</th><td>Физика, XI класс, базовый уровень; учащиеся учреждений среднего специального образования на основе общего базового образования</td></tr>' +
    '<tr><th>Раздел программы</th><td>Квантовая физика: темы 5–8 учебной программы (постановление Министерства образования Республики Беларусь от 29.07.2025 № 132)</td></tr>' +
    '<tr><th>Автор</th><td>Слепенчук Илья Олегович, преподаватель физики</td></tr>' +
    '<tr><th>Учреждение</th><td>Учреждение образования «Гомельский государственный автомеханический колледж», г. Гомель</td></tr>' +
    '<tr><th>Год</th><td>2026</td></tr>' +
    '<tr><th>Формат</th><td>HTML5, статический сайт; работает в браузере без установки и без интернета</td></tr></table></div>');
  sec('Аннотация', '<p>Учебник построен вокруг одной идеи: учащийся учится переходить от наблюдения к модели и объяснению, понимая границы применимости каждой модели. В каждом из ' + QB.TOC.list.length + ' модулей он сначала фиксирует прогноз, затем исследует управляемую физическую модель, сверяет прогноз с результатом, выполняет тестовые задания с пояснениями и объясняет новую ситуацию. Материал адресован типичным затруднениям: смешению интенсивности света и энергии фотона, представлению об электроне как о «планете», ожиданию, что ядро распадается «по расписанию», подмене эксперимента компьютерной моделью.</p><p>Модули автономны, имеют единый интерфейс, поиск по понятиям и формулам, словарь, локальное сохранение прогресса, режим проектора, печатную версию и материалы для преподавателя.</p>');
  sec('Что в учебнике является моделью, а что — нет', '<ul><li>Все интерактивные сцены — <b>учебные модели</b>. Они вычисляют результат по формулам, указанным в тексте, и не заменяют реальный эксперимент. У каждой модели перечислены границы применимости.</li><li>Движущиеся «фотоны», «электроны», «ядра» — <b>условные обозначения</b>; размеры и скорости не в масштабе.</li><li>Иллюстрации нарисованы кодом (SVG). Среди них нет фотографий реальных приборов, учёных или лабораторий, и ни одна не выдаётся за фотографию.</li><li>В учебнике <b>нет результатов апробации</b>, отзывов и статистики: они появятся только после реального использования.</li></ul>');
  sec('Источники', '<ul>' +
    '<li>Учебная программа по учебному предмету «Физика» для X–XI классов учреждений общего среднего образования (базовый уровень). Утверждена постановлением Министерства образования Республики Беларусь от 29.07.2025 № 132. <a href="https://adu.by/images/2025/08/12/Fizika-10-11.pdf" target="_blank" rel="noopener">adu.by</a></li>' +
    '<li>OpenStax. University Physics, vol. 2–3 (лицензия CC BY 4.0) — физические модели и проверка формул. <a href="https://openstax.org/details/books/university-physics-volume-3" target="_blank" rel="noopener">openstax.org</a></li>' +
    '<li>McKagan S. B., Handley W., Perkins K. K., Wieman C. E. A research-based curriculum for teaching the photoelectric effect. American Journal of Physics 77, 87–94 (2009). DOI 10.1119/1.2978181 — методическая опора для модуля о фотоэффекте.</li>' +
    '<li>CODATA 2018 — значения фундаментальных постоянных.</li>' +
    '<li>Wang M. et al. The AME 2020 atomic mass evaluation. Chinese Physics C 45, 030003 (2021) — атомные массы.</li>' +
    '<li>NIST Atomic Spectra Database — длины волн спектральных линий; NuDat (NNDC) — периоды полураспада.</li>' +
    '<li>UNSCEAR 2008 Report; ICRP Publication 103 — сведения о дозах и естественном фоне.</li>' +
    '<li>Первичные публикации указаны в разделе «Итог» соответствующих модулей.</li></ul>' +
    '<p class="note">Числовые значения масс, длин волн и периодов полураспада перед подачей на конкурс сверяются автором с указанными справочниками; журнал проверки ведётся в документации проекта.</p>');
  sec('Образец для сравнения', '<p>Продуктовым ориентиром служил открытый проект <a href="https://github.com/DozenTwelve/Papermorph" target="_blank" rel="noopener">Papermorph</a> (лицензия MIT): книжная структура, объяснение рядом с изображением, упражнения внутри материала, статическая поставка. <b>Код, тексты и изображения Papermorph не использованы</b>; учебник не построен на движке Papermorph. Собственными являются содержание, педагогический цикл «прогноз — исследование — возврат к прогнозу», физические модели, система заданий и визуальный язык.</p>');
  sec('Лицензии и права', '<ul><li><b>Шрифты</b> поставляются локально: Golos Text, Playfair Display, PT Serif — все под SIL Open Font License 1.1 (тексты лицензий лежат в папке <code>assets/fonts</code>).</li><li><b>Сторонних библиотек</b> в учебнике нет: код написан без фреймворков.</li><li><b>Иллюстрации и схемы</b> созданы для этого проекта, сторонних изображений нет.</li><li><b>Внешние ссылки</b> (PhET, OpenStax, справочные базы) ведут на независимые ресурсы, помечены как внешние и для работы учебника не нужны.</li></ul>');
  sec('Использование искусственного интеллекта', '<p>Положение о конкурсе требует раскрыть использование ИИ. Раскрываем полностью.</p><ul>' +
    '<li><b>Система:</b> Claude (Anthropic) в среде Claude Code.</li>' +
    '<li><b>Что создано с помощью ИИ:</b> программный код учебника, тексты модулей, тестовые задания с пояснениями, SVG-иллюстрации и схемы, черновики методических документов.</li>' +
    '<li><b>Что принадлежит автору:</b> замысел и педагогическая идея, структура курса и требования к каждому модулю, выбор типичных затруднений учащихся, требования к научной корректности и честности материалов (исходное техническое задание сохранено в документации), проверка и редактирование содержания, апробация.</li>' +
    '<li><b>Доля ИИ по типам объектов</b> на момент первой сборки: код — 100 % сгенерирован по заданию автора; тексты и задания — 100 % сгенерированы и подлежат проверке и правке автором; иллюстрации — 100 % нарисованы кодом, написанным ИИ. Доли пересчитываются после авторской редактуры.</li>' +
    '<li><b>Проверка:</b> автоматическая (ключи заданий, расчёты моделей, запуск сцен) выполнена; предметная и методическая проверка преподавателем — обязательный этап до использования на занятии.</li></ul>' +
    '<p class="note">Полный журнал с запросами лежит в документации проекта (AI_USAGE.md).</p>');
  sec('Доступность и данные', '<ul><li>Все действия доступны с клавиатуры; перетаскивание не используется.</li><li>Ошибка в задании сообщается текстом и значком, а не только цветом.</li><li>Схемы имеют текстовые описания; состояние моделей дублируется текстом для программ экранного доступа.</li><li>При системной настройке «уменьшить движение» анимации заменяются статичным кадром.</li><li>Звука в учебнике нет.</li><li>Учебник не собирает персональные данные, не использует счётчики и рекламу. Прогресс хранится только в браузере пользователя; его можно экспортировать и удалить (кнопка «Данные»).</li></ul>');
  QB.footer();
})();
</script>
