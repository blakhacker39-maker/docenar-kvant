<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Преподавателю — DOCENAR • КВАНТ</title>
<meta name="description" content="Методические рекомендации, карта соответствия программе, обзор локальной сессии и печатные материалы.">
<link rel="stylesheet" href="lib/style.css">
<link rel="icon" href="assets/images/favicon.svg">
</head>
<body>
<script src="lib/physics.js"></script>
<script src="lib/core.js"></script>
<script src="lib/toc.js"></script>
<script>
(function () {
  var h = QB.h, T = QB.TOC, all = QB.store.all();
  QB.topbar('Преподавателю');
  var main = h('main', { class: 'wrap', id: 'main' }); document.body.appendChild(main);
  function sec(title, kids, id) { var s = h('section', { class: 'card', id: id }, [h('h2', { text: title })].concat(kids)); main.appendChild(s); return s; }
  function ul(items) { return h('ul', {}, items.map(function (t) { return h('li', { html: t }); })); }
  main.appendChild(h('h1', { text: 'Преподавателю' }));
  main.appendChild(h('p', { style: 'max-width:80ch', html: 'Здесь собрано всё, что нужно для работы с учебником на занятии: как устроен модуль, как он соотносится с программой, что видно о работе одного ученика на этом устройстве и что напечатать. Ключи к заданиям и методические комментарии внутри модулей открываются кнопкой <b>«Преподаватель»</b> в верхней панели.' }));
  main.appendChild(h('p', { class: 'warn', style: 'max-width:80ch', html: '<b>Это не защищённый кабинет.</b> Режим преподавателя — локальный показ ключей без пароля: его может включить любой, кто откроет учебник. Не используйте учебник как единственное средство контроля. Результаты класса учебник не собирает и никуда не передаёт.' }));

  sec('Как устроен каждый модуль', [h('div', { class: 'tw' }, h('table', { class: 't' }, [h('tr', {}, ['Шаг', 'Что делает учащийся', 'Дидактическая функция'].map(function (x) { return h('th', { text: x }); }))].concat([
    ['1. Вопрос', 'Читает проблемную ситуацию, фиксирует прогноз до изучения темы; видит цель и ожидаемые результаты', 'мотивационная; актуализация представлений'],
    ['2. Теория', 'Изучает компактный материал с иллюстрациями и формулами', 'обучающая'],
    ['3. Пример', 'Разбирает решённую задачу, раскрывая шаги по одному', 'обучающая; образец рассуждения'],
    ['4. Исследование', 'Работает с изменяемой моделью по заданиям или смотрит пошаговое объяснение; возвращается к прогнозу', 'развивающая; формирование исследовательских умений'],
    ['5. Проверка', 'Выполняет 7 тестовых заданий разных типов с пояснениями', 'закрепление и контроль'],
    ['6. Перенос', 'Объясняет новую ситуацию письменно, сверяется с опорным ответом и рубрикой, оценивает себя', 'развивающая; рефлексия'],
    ['7. Итог', 'Повторяет главное, словарь, межпредметные связи, источники', 'обобщение; воспитательная']
  ].map(function (r) { return h('tr', {}, r.map(function (c) { return h('td', { text: c }); })); })))),
    h('p', { style: 'margin-top:.8em', html: 'Сквозной цикл: <b>заметь явление → сделай прогноз → выбери условия → исследуй → объясни → реши новую задачу → оцени границы вывода.</b> Два режима исследования равноправны: «Читаю и исследую» — самостоятельная работа с моделью; «Смотрю объяснение» — пошаговый показ с кнопками «Назад», «Дальше» и паузой (удобно для фронтальной работы с проектором).' })]);

  sec('Сценарии использования на занятии', [ul([
    '<b>Фронтально с проектором.</b> Включите «Проектор» (крупный шрифт). Шаг 1 — прогноз голосованием рук, вариант класса вносит преподаватель. Шаг 4 — режим «Смотрю объяснение», после каждого шага вопрос классу. Шаг 5 — два-три задания устно.',
    '<b>В парах за компьютерами.</b> Один управляет моделью, второй ведёт записи в тетради; на шаге 5 меняются. Преподаватель обходит пары с вопросом «что вы сейчас проверяете и что оставили неизменным?».',
    '<b>Перевёрнутый класс.</b> Шаги 1–3 дома, шаги 4–6 на занятии.',
    '<b>Самостоятельная работа и повторение.</b> Модуль проходится целиком за 30–45 минут; прогресс сохраняется в браузере ученика.',
    '<b>Без компьютеров у учащихся.</b> Напечатайте рабочий лист модуля (кнопка «Печать модуля» на шаге «Итог»); модель показывайте с проектора.'
  ]), h('p', { class: 'note', html: '<b>Режим работы с экраном.</b> Модуль построен так, чтобы непрерывная работа с экраном чередовалась с обсуждением и записями: в комментариях к каждому модулю указаны хронометраж и вид деятельности без экрана. Допустимую длительность работы с устройствами определяйте по действующим санитарным нормам и правилам для вашего типа учреждения; учебник сам по себе их соблюдение не гарантирует.' })]);

  /* карта программы */
  var rows = [h('tr', {}, ['№', 'Тема программы → пункт', 'Модуль', 'Результаты (от лица учащегося)', 'Проверка'].map(function (x) { return h('th', { text: x }); }))];
  T.list.forEach(function (m) { rows.push(h('tr', {}, [h('td', { text: m.n }), h('td', { text: m.program }), h('td', {}, h('a', { href: 'modules/' + m.id + '.html', text: m.title })), h('td', {}, h('ul', { style: 'margin:0;padding-left:1.1em' }, m.results.map(function (r) { return h('li', { text: r }); }))), h('td', { text: 'тест ' + m.q + ' заданий; перенос с рубрикой 0–2' })])); });
  sec('Карта соответствия программе', [h('p', { style: 'max-width:85ch', html: 'Источник: учебная программа по учебному предмету «Физика» для X–XI классов, базовый уровень (постановление Министерства образования Республики Беларусь от 29.07.2025 № 132), темы 5–8, 22 часа. <b>Программа задаёт четыре темы и примерное число часов; разбивка на 22 занятия — рабочая</b> и должна быть сверена с календарно-тематическим планом учреждения. Модули 11–12 и 15–16 при необходимости объединяются в сдвоенные занятия, модуль 18 делится на два.' }), h('div', { class: 'tw' }, h('table', { class: 't' }, rows))], 'map');

  /* обзор локальной сессии */
  var sess = [h('tr', {}, ['№', 'Модуль', 'Шаги', 'Прогноз: первый → итоговый', 'Тест: первая попытка', 'Перенос (самооценка)', 'Отмеченные приёмы'].map(function (x) { return h('th', { text: x }); }))], any = false;
  T.list.forEach(function (m) {
    var d = all.mods[m.id]; if (!d) return; any = true;
    var steps = QB.STEPS.filter(function (s) { return d.steps && d.steps[s[0]]; }).length, pr = d.predict || {}, first = 0, tried = 0;
    m.qids.forEach(function (id) { var r = (d.quiz || {})[id]; if (r && r.first != null) { tried++; if (r.first) first++; } });
    var f = function (v) { return v == null ? '—' : (v === m.predict ? 'верно' : 'неверно'); };
    sess.push(h('tr', {}, [h('td', { text: m.n }), h('td', { text: m.title }), h('td', { text: steps + ' из 7' }), h('td', { text: f(pr.first) + ' → ' + f(pr.final) }), h('td', { text: tried ? first + ' из ' + tried + ' (всего ' + m.q + ')' : '—' }), h('td', { text: d.transfer && d.transfer.self != null ? d.transfer.self + ' из 2' : '—' }), h('td', { text: Object.keys(d.badges || {}).map(function (k) { return QB.BADGES[k] ? QB.BADGES[k][0] : k; }).join(', ') || '—' })]));
  });
  sec('Обзор работы на этом устройстве', [h('p', { style: 'max-width:85ch', html: 'Таблица показывает только то, что сохранено в <b>этом браузере</b>. Это данные одной локальной сессии (одного ученика или пары), а не класса. В столбце теста учитывается первая попытка; тренировочные повторы на неё не влияют.' }),
    any ? h('div', { class: 'tw' }, h('table', { class: 't' }, sess)) : h('p', { class: 'note', text: 'На этом устройстве учебник ещё не проходили — данных нет.' }),
    h('div', { class: 'row noprint', style: 'margin-top:.8em' }, [h('button', { class: 'btn', text: 'Экспортировать данные в файл', onclick: QB.store.export }), h('button', { class: 'btn', text: 'Печать этой страницы', onclick: function () { window.print(); } }), h('button', { class: 'btn ghost', text: 'Управление данными', onclick: QB.openData })]),
    h('p', { class: 'note', style: 'margin-top:.8em', html: '<b>Как собрать результаты группы вручную.</b> Учащийся нажимает «Данные → Экспортировать в файл» и передаёт файл преподавателю, либо преподаватель переписывает строку этой таблицы в сводную ведомость. Используйте коды вместо фамилий; помните, что код, который можно связать с человеком, остаётся персональными данными. Шаблон сводной таблицы — в папке <code>docs</code> (PILOT_PROTOCOL.md).' })], 'session');

  sec('Оценивание открытых ответов', [h('p', { html: 'Задание на перенос в каждом модуле оценивается по единой рубрике. Автоматически открытые ответы не оцениваются: поиск ключевых слов не позволяет судить о рассуждении.' }),
    h('div', { class: 'tw' }, h('table', { class: 't rub' }, [h('tr', {}, [h('td', { text: '0' }), h('td', { text: 'Вывода нет или он неверный.' })]), h('tr', {}, [h('td', { text: '1' }), h('td', { text: 'Вывод верный, но обоснование неполное: не названы условия или физическая связь (уточнение — в каждом модуле).' })]), h('tr', {}, [h('td', { text: '2' }), h('td', { text: 'Верный вывод с условиями и физической связью.' })])]))]);

  sec('Апробация: что учебник даёт и чего не даёт', [ul([
    'Учебник <b>не содержит результатов апробации</b>: в нём нет ни отзывов, ни процентов «роста». Эффективность можно утверждать только после реального использования.',
    'Для пилотного занятия подготовлены: сценарий, входная и выходная диагностика с ключами, рубрика, журнал технических затруднений, шаблон сводной таблицы и памятка по интерпретации (папка <code>docs</code>, файл PILOT_PROTOCOL.md).',
    'Без группы сравнения рост результата не доказывает, что его вызвал учебник: влияют повторное тестирование, знакомство с форматом, обычное обучение. Формулируйте выводы осторожно.',
    'Акт внедрения оформляется и подписывается руководителем учреждения только после фактического использования.'
  ])]);

  sec('Технические сведения', [ul([
    'Учебник — статический сайт: HTML, CSS, JavaScript. Все шрифты, иллюстрации и скрипты лежат локально; интернет нужен только для необязательных внешних ссылок в разделе «Дополнительно».',
    'Каждый модуль — отдельный файл <code>modules/mNN.html</code> и может использоваться автономно.',
    'Запуск без установки: открыть <code>index.html</code> двойным щелчком. Проверено в браузере на движке Chromium; если ваш браузер ограничивает локальные файлы, воспользуйтесь запуском через локальный сервер (см. README).',
    'Навигация с клавиатуры: Tab — по элементам, Alt + ← и Alt + → — предыдущий и следующий шаг. Анимации отключаются при системной настройке «уменьшить движение».',
    '<a href="qa.html">Страница автоматической самопроверки</a>: ключи всех заданий, запуск всех моделей, иллюстрации, формулы.'
  ])]);
  QB.footer();
})();
</script>
</body>
</html>
